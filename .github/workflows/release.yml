# ============================================================================
# Release Workflow for NexTerm
# ============================================================================
#
# AUTO-UPDATE SIGNING SETUP (required before first release):
#
# 1. Generate a signing keypair:
#      npx @tauri-apps/cli signer generate -w ~/.tauri/nexterm.key
#
# 2. Add the PRIVATE key to GitHub Secrets:
#      - Secret name: TAURI_SIGNING_PRIVATE_KEY
#      - Value: the full content of ~/.tauri/nexterm.key
#
# 3. If the key has a password, add it to GitHub Secrets:
#      - Secret name: TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#      - Value: the password you used during key generation
#
# 4. Copy the PUBLIC key into tauri.conf.json:
#      → plugins.updater.pubkey = "<your-public-key>"
#
# 5. Update the endpoint URL in tauri.conf.json with the actual owner/repo:
#      → plugins.updater.endpoints = ["https://github.com/{owner}/{repo}/releases/latest/download/latest.json"]
#
# CRITICAL RELEASES:
#   To mark a release as critical (forces mandatory update with no dismiss),
#   include [CRITICAL] anywhere in the release notes body when creating the tag/release.
#   The app client parses the release body for this marker.
#
# HOW IT WORKS:
#   - On tag push (v*), this workflow builds for all platforms
#   - tauri-action signs the updater artifacts using TAURI_SIGNING_PRIVATE_KEY
#   - Releases are published immediately (not draft) so latest.json is served
#   - The app checks https://github.com/{owner}/{repo}/releases/latest/download/latest.json
# ============================================================================

name: Release NexTerm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (for example: v0.2.3 or 0.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-ARM64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-Intel
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm exec tsc --noEmit

      - name: Run frontend tests
        run: pnpm test

      - name: Run Rust tests
        run: cd src-tauri && cargo test

      - name: Extract release notes from changelog
        id: release_notes
        shell: bash
        run: |
          REF_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          VERSION="${REF_NAME#v}"
          TAG_NAME="v${VERSION}"
          NOTES="$(awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && $0 ~ "^## \\[" { capture = 0 }
            capture { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d')"

          if [ -z "$NOTES" ]; then
            echo "Exact release notes for ${TAG_NAME} were not found in CHANGELOG.md." >&2
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          {
            echo 'body<<EOF'
            echo "## NexTerm ${TAG_NAME}"
            echo
            echo "$NOTES"
            echo
            echo '### Downloads'
            echo '| Platform | Artifact |'
            echo '|---|---|'
            echo '| macOS Apple Silicon | `.dmg` |'
            echo '| macOS Intel | `.dmg` |'
            echo '| Linux x64 | `.deb` + `.AppImage` |'
            echo '| Windows x64 | `.msi` + `.exe` |'
            echo
            echo 'See CHANGELOG.md for the full project history.'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release_notes.outputs.tag_name }}
          releaseName: "NexTerm ${{ steps.release_notes.outputs.tag_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
