<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<meta name="theme-color" content="#100e0b" />
		<title>VaulTerm — the SSH workspace with a vault at its core</title>
		<meta
			name="description"
			content="VaulTerm is a native SSH client for macOS, Windows and Linux: terminal with tabs and split panes, dual-pane SFTP, SSH tunnels, encrypted credential vault and password manager, Docker and Proxmox panels, remote monitoring. No account, no telemetry."
		/>
		<meta property="og:title" content="VaulTerm — your servers and your secrets, one workspace" />
		<meta
			property="og:description"
			content="Native SSH terminal + dual-pane SFTP + tunnels + encrypted vaults + Docker/Proxmox panels. Free for macOS, Windows and Linux."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:image" content="%sveltekit.assets%/shots/terminal.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..650&family=Schibsted+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
