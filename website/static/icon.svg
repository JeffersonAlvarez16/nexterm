<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background: deep space navy -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101729"/>
      <stop offset="55%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>

    <!-- Ambient glow behind the glyph -->
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.55">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#1d4ed8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>

    <!-- Aurora accent: cyan to blue to violet -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#38bdf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Cursor gradient -->
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Top sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft halo for the chevron (fake outer glow, no filters) -->
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.22"/>
    </linearGradient>

    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <!-- Base squircle -->
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>

  <g clip-path="url(#squircle)">
    <!-- Ambient center glow -->
    <rect width="1024" height="1024" fill="url(#glow)"/>

    <!-- Faint orbital arcs: connectivity motif -->
    <circle cx="512" cy="512" r="368" fill="none" stroke="#60a5fa" stroke-opacity="0.10" stroke-width="2.5"/>
    <circle cx="512" cy="512" r="436" fill="none" stroke="#60a5fa" stroke-opacity="0.05" stroke-width="2"/>
    <!-- Node dots on the inner orbit -->
    <circle cx="512" cy="144" r="9" fill="#67e8f9" opacity="0.55"/>
    <circle cx="831" cy="696" r="7" fill="#818cf8" opacity="0.45"/>
    <circle cx="193" cy="696" r="7" fill="#38bdf6" opacity="0.45"/>

    <!-- Top sheen -->
    <rect width="1024" height="540" fill="url(#sheen)"/>
  </g>

  <!-- Halo strokes behind glyph (soft glow imitation) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 360 L484 512 L300 664" fill="none" stroke="url(#halo)" stroke-width="118"/>
    <rect x="481" y="605" width="322" height="118" rx="59" fill="url(#halo)"/>
  </g>

  <!-- Terminal glyph ">_" -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 360 L484 512 L300 664" fill="none" stroke="url(#accent)" stroke-width="76"/>
    <rect x="502" y="626" width="280" height="76" rx="38" fill="url(#cursor)"/>
  </g>

  <!-- Specular highlight on the chevron elbow -->
  <path d="M318 378 L466 500" fill="none" stroke="#e0f2fe" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round"/>

  <!-- Inner border for definition -->
  <rect x="3" y="3" width="1018" height="1018" rx="225" ry="225"
        fill="none" stroke="#3b82f6" stroke-opacity="0.22" stroke-width="3"/>
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="227" ry="227"
        fill="none" stroke="#0c1220" stroke-width="3"/>
</svg>
